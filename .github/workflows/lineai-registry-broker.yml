# lineai-intelligence-registry-broker v2
name: Lineai Intelligence Registry Broker

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Lineai registry broker session id
        required: true
      session_secret:
        description: Lineai registry broker session secret
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  registry-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Register Maven token with Lineai
        env:
          LINEAI_HOST: ${{ vars.LINEAI_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          host="${LINEAI_HOST%/}"
          if [ -z "$host" ]; then
            echo "LINEAI_HOST repository variable is not set"
            exit 1
          fi
          payload=$(printf '{"repositoryFullName":"%s","githubToken":"%s","runId":%s}' \
            "${{ github.repository }}" "$GITHUB_TOKEN" "${{ github.run_id }}")
          curl -sfS -X POST \
            -H "Authorization: Bearer ${{ inputs.session_secret }}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${host}/api/registry-broker/sessions/${{ inputs.session_id }}/register"
      - name: Hold token until Lineai releases the session
        env:
          LINEAI_HOST: ${{ vars.LINEAI_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub revokes GITHUB_TOKEN when this job ends. Poll until neo4cape
          # releases the session (upgrade pod finished) or hit the job timeout.
          host="${LINEAI_HOST%/}"
          status_url="${host}/api/registry-broker/sessions/${{ inputs.session_id }}/status"
          poll_seconds=30
          while true; do
            code=$(curl -sS -o /tmp/lineai-broker-status.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ inputs.session_secret }}" \
              "$status_url" || true)
            if [ "$code" = "200" ]; then
              released=$(sed -n 's/.*"released"[[:space:]]*:[[:space:]]*\(true\|false\).*/\1/p' \
                /tmp/lineai-broker-status.json | head -1)
              if [ "$released" = "true" ]; then
                echo "Session released; exiting so GITHUB_TOKEN is revoked"
                exit 0
              fi
            elif [ "$code" = "404" ]; then
              echo "Session no longer found; exiting"
              exit 0
            else
              echo "Status poll HTTP ${code}; will retry"
            fi
            sleep "$poll_seconds"
          done
